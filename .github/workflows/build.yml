name: build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (aarch64) test + bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests (real macOS toolchain)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build app bundle (app + dmg)
        run: npm run tauri build -- --config src-tauri/tauri.macos.conf.json

      - name: Package .app archive
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf ../dmg/DeepSeek-Harness-Desktop-macos-aarch64.app.tar.gz "DeepSeek Harness Desktop.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.app.tar.gz
          if-no-files-found: error

  windows:
    name: Windows test + bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installers (nsis + msi)
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release (macOS & Windows)
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-desktop-macos
          path: release-assets/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-desktop-windows
          path: release-assets/windows

      - name: Flatten assets for Release
        run: |
          mkdir -p release-dist
          find release-assets -type f -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Harness Desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-dist/*
          generate_release_notes: true
