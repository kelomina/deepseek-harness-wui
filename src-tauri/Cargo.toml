[package]
name = "deepseek-harness-wui"
version = "0.3.0"
description = "DeepSeek Harness Desktop - Rust + WebView2 shell (Tauri 2) with custom frontend"
authors = ["Saika"]
edition = "2021"

[lib]
name = "deepseek_harness_wui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "io-util", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls-native-roots", "socks"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
dirs = "6"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# 剪贴板：macOS 走原生 pbcopy（见 lib.rs clipboard_write），不引入 objc2 工具链
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
arboard = "3"

